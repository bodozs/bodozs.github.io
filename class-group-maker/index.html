<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    :root{
      --bg: #f6fbff;
      --bg-soft: #eef7ff;
      --panel: #ffffff;
      --panel-soft: #f8fbff;
      --border: #dbe8f4;
      --border-strong: #c7ddef;
      --text: #243447;
      --muted: #5f7489;
      --primary: #2f80ed;
      --primary-2: #54c3a8;
      --success: #1f9d6b;
      --danger: #c96a7c;
      --danger-text: #9a4d5c;
      --danger-soft: #f8fbff;
      --danger-hover: #fff8fa;
      --danger-border: #edcfd6;
      --danger-border-hover: #e5bbc5;
      --warning: #b7791f;
      --warning-soft: #fff8e6;
      --shadow: 0 12px 30px rgba(46, 99, 155, 0.09);
      --radius: 18px;
      --radius-sm: 12px;
      --select-arrow: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235f7489' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(83,193,167,0.14), transparent 28%),
        radial-gradient(circle at top right, rgba(255,209,102,0.16), transparent 30%),
        linear-gradient(180deg, #fbfdff 0%, #f1f8ff 100%);
    }

    body {
      min-height: 100vh;
      padding: 14px;
    }

    .app {
      width: min(1220px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,0.97), rgba(244,250,255,0.94));
      box-shadow: var(--shadow);
    }

    .topbar h1 {
      margin: 0 0 2px;
      font-size: clamp(1.28rem, 2vw, 1.7rem);
      line-height: 1.12;
      color: #1f3550;
    }

    .topbar p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.38;
    }

    .topbar-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.86rem;
      white-space: nowrap;
    }

    .pill strong {
      color: #23405e;
    }

    .language-pill {
      align-items: center;
      display: inline-flex;
      gap: 4px;
      padding: 0;
      background: transparent;
      border-color: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .language-pill select {
      min-height: 26px;
      padding: 3px 24px 3px 8px;
      border-radius: 999px;
      border-color: transparent;
      background-color: transparent;
      background-position: right 7px center;
      background-size: 12px 12px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 650;
      box-shadow: none;
    }

    .language-pill select:hover,
    .language-pill select:focus {
      background-color: #f4f9ff;
      border-color: var(--border);
      color: #24435f;
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(360px, 1.04fr) minmax(320px, 0.96fr);
      gap: 14px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-inner {
      padding: 14px;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: #23405e;
    }

    .field-row {
      display: grid;
      gap: 6px;
    }

    .compact-label {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .select-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: stretch;
    }

    input[type="text"], select {
      width: 100%;
      border: 1px solid var(--border-strong);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.96rem;
      outline: none;
      transition: 0.18s ease;
      min-height: 40px;
    }

    input[type="text"] {
      background: #fff;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-color: #f8fbff;
      background-image: var(--select-arrow);
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 14px 14px;
      padding-right: 38px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45);
    }

    input[type="text"]:focus, select:focus {
      border-color: rgba(47,128,237,0.75);
      box-shadow: 0 0 0 4px rgba(47,128,237,0.12);
    }

    select:hover {
      background-color: #f2f8ff;
      border-color: #afcde9;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.15s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      min-height: 40px;
      white-space: nowrap;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #63a7ff);
      color: white;
      box-shadow: 0 8px 18px rgba(47,128,237,0.16);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--primary-2), #7cd8c1);
      color: #103f35;
      box-shadow: 0 8px 18px rgba(83,193,167,0.16);
    }

    .btn-secondary {
      background: #f4f9ff;
      color: #24435f;
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--text);
      border: 1px solid var(--danger-border);
    }

    .btn-danger:hover,
    .btn-danger:focus {
      background: var(--danger-hover);
      color: var(--danger-text);
      border-color: var(--danger-border-hover);
    }

    .btn-warning {
      background: var(--warning-soft);
      color: #8b5c18;
      border: 1px solid #efd89f;
    }

    .btn-icon {
      min-height: 30px;
      padding: 5px 8px;
      font-size: 0.78rem;
      border-radius: 9px;
      font-weight: 700;
    }

    .btn-manage {
      min-width: 118px;
      background: #f4f9ff;
      color: #24435f;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-manage::after {
      content: "";
      width: 14px;
      height: 14px;
      background-image: var(--select-arrow);
      background-repeat: no-repeat;
      background-position: center;
      background-size: 14px 14px;
      flex: 0 0 14px;
    }

    .message {
      min-height: 18px;
      font-size: 0.9rem;
      font-weight: 600;
      padding-top: 2px;
    }

    .message.error { color: #b83d55; }
    .message.success { color: #187a55; }
    .message.info { color: #2d5f92; }

    .participants {
      display: grid;
      gap: 6px;
      margin-top: 8px;
      max-height: 505px;
      overflow: auto;
      padding-right: 2px;
    }

    .participant-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 7px 10px;
      background: #fbfdff;
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 42px;
    }

    .participant-item.absent {
      background: #fffaf0;
      border-color: #efd89f;
      opacity: 0.72;
    }

    .attendance-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1.5px solid var(--border-strong);
      background: #fff;
      cursor: pointer;
      transition: 0.15s ease;
      flex: 0 0 auto;
      position: relative;
    }

    .attendance-toggle:hover {
      border-color: #9bbfe7;
      background: #f6fbff;
    }

    .attendance-toggle.absent {
      background: #fff4d8;
      border-color: #e7c772;
    }

    .attendance-toggle.absent::after {
      content: "–";
      position: absolute;
      font-weight: 900;
      font-size: 13px;
      color: #9a681a;
      line-height: 1;
      transform: translateY(-0.5px);
    }

    .participant-main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .participant-name {
      font-weight: 650;
      word-break: break-word;
      color: #24435f;
      font-size: 0.94rem;
      line-height: 1.2;
    }

    .participant-tag {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--warning-soft);
      border: 1px solid #efd89f;
      color: #94641d;
      flex: 0 0 auto;
    }

    .small-actions {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: flex-end;
      align-items: center;
    }

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .group-card {
      background: linear-gradient(180deg, #ffffff, #f7fbff);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px;
      min-height: 110px;
    }

    .group-card h3 {
      margin: 0 0 8px;
      font-size: 0.98rem;
      color: #23405e;
    }

    .member-list {
      margin: 0;
      padding-left: 18px;
    }

    .member-list li {
      margin: 5px 0;
      line-height: 1.35;
      font-size: 0.94rem;
    }

    .history-list {
      display: grid;
      gap: 8px;
      margin-top: 8px;
      max-height: 320px;
      overflow: auto;
      padding-right: 2px;
    }

    .history-item {
      background: #fbfdff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 11px;
    }

    .history-time {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 5px;
    }

    .history-groups {
      display: grid;
      gap: 4px;
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .empty {
      border: 1px dashed var(--border-strong);
      border-radius: 14px;
      padding: 14px;
      color: var(--muted);
      background: #fbfdff;
      line-height: 1.45;
      font-size: 0.92rem;
    }

    details.secondary-panel {
      background: #fbfdff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0;
      overflow: hidden;
    }

    details.secondary-panel summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 700;
      color: #23405e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      font-size: 0.94rem;
    }

    details.secondary-panel summary::-webkit-details-marker {
      display: none;
    }

    details.secondary-panel summary::after {
      content: "";
      width: 14px;
      height: 14px;
      background-image: var(--select-arrow);
      background-repeat: no-repeat;
      background-position: center;
      background-size: 14px 14px;
      transition: transform 0.15s ease;
    }

    details.secondary-panel[open] summary::after {
      transform: rotate(180deg);
    }

    details.secondary-panel[open] summary {
      border-bottom: 1px solid var(--border);
    }

    .secondary-content {
      padding: 12px 14px 14px;
      display: grid;
      gap: 12px;
    }

    .group-toolbar {
      display: grid;
      grid-template-columns: minmax(140px, 180px) auto auto;
      gap: 8px;
      align-items: end;
      margin-bottom: 10px;
    }

    .mini-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .menu-wrap {
      position: relative;
    }

    .menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 190px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(31, 53, 80, 0.14);
      padding: 6px;
      z-index: 30;
      display: none;
    }

    .menu.open {
      display: block;
    }

    .menu button {
      width: 100%;
      text-align: left;
      justify-content: flex-start;
      min-height: 38px;
      background: transparent;
      border: 1px solid transparent;
      box-shadow: none;
      color: #24435f;
      padding: 9px 10px;
      font-size: 0.9rem;
    }

    .menu button:hover {
      transform: none;
      background: #f5faff;
      border-color: var(--border);
    }

    .menu-divider {
      margin: 6px 4px;
      border-top: 1px solid #e8eef5;
    }

    .menu button.menu-danger {
      color: var(--text);
      background: var(--danger-soft);
      border-color: var(--danger-border);
    }

    .menu button.menu-danger:hover,
    .menu button.menu-danger:focus {
      color: var(--danger-text);
      background: var(--danger-hover);
      border-color: var(--danger-border-hover);
    }

    @media (max-width: 1020px) {
      .main-grid {
        grid-template-columns: 1fr;
      }

      .participants {
        max-height: none;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .topbar-stats {
        justify-content: flex-start;
      }

      .group-toolbar,
      .select-row {
        grid-template-columns: 1fr;
      }

      .menu {
        left: 0;
        right: auto;
        min-width: 100%;
      }
    }

    @media (max-width: 560px) {
      body { padding: 10px; }
      .topbar, .panel-inner { padding: 12px; }
      .input-row { flex-direction: column; }
      .participant-item {
        grid-template-columns: auto 1fr;
        grid-template-areas:
          "toggle main"
          ". actions";
        align-items: center;
      }
      .participant-item .attendance-toggle { grid-area: toggle; }
      .participant-item .participant-main { grid-area: main; }
      .participant-item .small-actions {
        grid-area: actions;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="topbar">
      <div>
        <h1 data-i18n="app.title"></h1>
        <p data-i18n="app.subtitle"></p>
      </div>
      <div class="topbar-stats">
        <div class="pill"><span data-i18n="stats.students"></span> <strong id="participantCount">0</strong></div>
        <div class="pill"><span data-i18n="stats.hereToday"></span> <strong id="presentCount">0</strong></div>
        <label class="pill language-pill" for="languageSelect">
          <span data-i18n="language.label"></span>
          <select id="languageSelect"></select>
        </label>
      </div>
    </section>

    <div class="main-grid">
      <section class="stack">
        <section class="panel">
          <div class="panel-inner">
            <h2 data-i18n="groups.today.title"></h2>

            <div class="group-toolbar">
              <div class="field-row">
                <label for="groupSize" class="compact-label" data-i18n="groups.size.label"></label>
                <select id="groupSize" data-i18n-aria-label="groups.size.label">
                </select>
              </div>

              <button id="generateBtn" class="btn-success" type="button" data-i18n="groups.make.button"></button>
              <button id="clearCurrentBtn" class="btn-secondary" type="button" data-i18n="groups.clear.button"></button>
            </div>

            <div id="message" class="message info" aria-live="polite"></div>
            <div id="groupsContainer" style="margin-top:10px;"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-inner">
            <details class="secondary-panel">
              <summary>
                <span id="historyTitle"></span>
              </summary>
              <div class="secondary-content">
                <div class="mini-toolbar">
                  <button id="resetHistoryBtn" class="btn-warning" type="button" data-i18n="groups.history.clear"></button>
                </div>

                <div id="historyContainer"></div>
              </div>
            </details>
          </div>
        </section>
      </section>

      <section class="stack">
        <section class="panel">
          <div class="panel-inner">
            <h2 data-i18n="classStudents.title"></h2>

            <div class="field-row" style="margin-bottom: 10px;">
              <label for="classSelect" class="compact-label" data-i18n="class.label"></label>
              <div class="select-row">
                <select id="classSelect" data-i18n-aria-label="class.label"></select>

                <div class="menu-wrap">
                  <button id="manageClassBtn" class="btn-manage" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n="class.manage.button">
                  </button>
                  <div id="manageClassMenu" class="menu" role="menu" data-i18n-aria-label="class.manage.ariaLabel">
                    <button id="renameClassBtn" type="button" role="menuitem" data-i18n="class.manage.rename"></button>
                    <button id="clearParticipantsBtn" type="button" role="menuitem" data-i18n="class.manage.removeAll"></button>
                    <div class="menu-divider" aria-hidden="true"></div>
                    <button id="deleteClassBtn" type="button" role="menuitem" class="menu-danger" data-i18n="class.manage.delete"></button>
                  </div>
                </div>
              </div>
            </div>

            <div class="field-row">
              <label for="nameInput" class="compact-label" data-i18n="student.add.label"></label>
              <div class="input-row">
                <input id="nameInput" type="text" data-i18n-placeholder="student.name.placeholder" maxlength="80" />
                <button id="addBtn" class="btn-primary" type="button" data-i18n="student.add.button"></button>
              </div>
            </div>

            <div id="participantsList" class="participants"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-inner">
            <details class="secondary-panel">
              <summary>
                <span data-i18n="class.new.title"></span>
              </summary>
              <div class="secondary-content">
                <div class="field-row">
                  <label for="newClassInput" class="compact-label" data-i18n="class.new.label"></label>
                  <div class="input-row">
                    <input id="newClassInput" type="text" data-i18n-placeholder="class.new.placeholder" maxlength="80" />
                    <button id="createClassBtn" class="btn-primary" type="button" data-i18n="class.new.button"></button>
                  </div>
                </div>
              </div>
            </details>
          </div>
        </section>
      </section>
    </div>
  </div>

  <script>

      function getTranslationValue(key) {
        const parts = key.split(".");
        const localized = parts.reduce((value, part) => value?.[part], translations[state.language]);
        return localized ?? parts.reduce((value, part) => value?.[part], translations.en);
      }

      function t(key, values = {}) {
        const template = getTranslationValue(key) ?? key;
        return String(template).replace(/\{(\w+)\}/g, (_, name) => {
          return Object.prototype.hasOwnProperty.call(values, name) ? values[name] : `{${name}}`;
        });
      }

        const saved = localStorage.getItem(LANGUAGE_STORAGE_KEY);
        state.language = translations[saved] ? saved : "en";

      function applyTranslations() {
        document.documentElement.lang = state.language;

        document.querySelectorAll("[data-i18n-placeholder]").forEach(element => {
          element.setAttribute("placeholder", t(element.getAttribute("data-i18n-placeholder")));
        });

        document.querySelectorAll("[data-i18n-aria-label]").forEach(element => {
          element.setAttribute("aria-label", t(element.getAttribute("data-i18n-aria-label")));
        });

        renderLanguageSelector();
        renderGroupSizeOptions();
        refreshMessage();

      function createClassObject(name) {
        return {
          id: createId(),
          name,
          preferredSize: 3,
          participants: [],
          history: [],
          pairCounts: {},
          currentGroups: []
        };
      }

      function createId() {
        return "class-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
      }

      function getCurrentClass() {
        return state.data.classes[state.data.activeClassId] || null;
      }

      function normalizeName(name) {
        return name.trim().replace(/\s+/g, " ");
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function setMessage(text, type = "info") {
        els.message.textContent = text;
        els.message.className = `message ${type}`;
      }

      function setMessageKey(key, type = "info", values = {}) {
        state.message = { key, type, values };
        setMessage(t(key, values), type);
      }

      function refreshMessage() {
        if (!state.message) return;
        setMessage(t(state.message.key, state.message.values), state.message.type);
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      }

      function migrateOldDataIfNeeded() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return false;

        const oldParticipants = JSON.parse(localStorage.getItem("german-group-splitter-participants") || "null");
        const oldPreferredSize = Number(localStorage.getItem("german-group-splitter-preferred-size")) || 3;
        const oldHistory = JSON.parse(localStorage.getItem("german-group-splitter-history") || "null");
        const oldPairCounts = JSON.parse(localStorage.getItem("german-group-splitter-pair-counts") || "null");
        const oldCurrentGroups = JSON.parse(localStorage.getItem("german-group-splitter-current-groups") || "null");

        if (!Array.isArray(oldParticipants) && !Array.isArray(oldHistory) && !Array.isArray(oldCurrentGroups)) {
          return false;
        }

        const groupClass = createClassObject(t("class.migratedName"));
        groupClass.preferredSize = oldPreferredSize >= 2 && oldPreferredSize <= 6 ? oldPreferredSize : 3;
        groupClass.participants = Array.isArray(oldParticipants)
          ? oldParticipants.map(name => ({ name: normalizeName(name), absent: false })).filter(p => p.name)
          : [];
        groupClass.history = Array.isArray(oldHistory) ? oldHistory : [];
        groupClass.pairCounts = oldPairCounts && typeof oldPairCounts === "object" ? oldPairCounts : {};
        groupClass.currentGroups = Array.isArray(oldCurrentGroups) ? oldCurrentGroups : [];

        state.data = {
          activeClassId: groupClass.id,
          classes: { [groupClass.id]: groupClass }
        };
        saveState();
        return true;
      }

      function loadState() {
        migrateOldDataIfNeeded();

        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (saved && typeof saved === "object") {
            state.data = saved;
          }
        } catch (err) {
          console.error("Could not read saved data:", err);
        }

        if (!state.data || typeof state.data !== "object") {
          state.data = { activeClassId: null, classes: {} };
        }

        if (!state.data.classes || typeof state.data.classes !== "object") {
          state.data.classes = {};
        }

        for (const id of Object.keys(state.data.classes)) {
          const groupClass = state.data.classes[id];
          if (!groupClass || typeof groupClass !== "object") {
            delete state.data.classes[id];
            continue;
          }

          groupClass.id = groupClass.id || id;
          groupClass.name = normalizeName(groupClass.name || t("class.migratedName")) || t("class.migratedName");
          groupClass.preferredSize = Number(groupClass.preferredSize) || 3;
          if (groupClass.preferredSize < 2 || groupClass.preferredSize > 6) groupClass.preferredSize = 3;

          if (!Array.isArray(groupClass.participants)) groupClass.participants = [];
          groupClass.participants = groupClass.participants
            .map(item => {
              if (typeof item === "string") {
                return { name: normalizeName(item), absent: false };
              }
              return {
                name: normalizeName(item?.name || ""),
                absent: Boolean(item?.absent)
              };
            })
            .filter(item => item.name);

          if (!Array.isArray(groupClass.history)) groupClass.history = [];
          if (!groupClass.pairCounts || typeof groupClass.pairCounts !== "object") groupClass.pairCounts = {};
          if (!Array.isArray(groupClass.currentGroups)) groupClass.currentGroups = [];
        }

        if (!state.data.activeClassId || !state.data.classes[state.data.activeClassId]) {
          const firstId = Object.keys(state.data.classes)[0];
          if (firstId) {
            state.data.activeClassId = firstId;
          } else {
            const starter = createClassObject(t("class.defaultName"));
            state.data.classes[starter.id] = starter;
            state.data.activeClassId = starter.id;
          }
        }

        saveState();
      }

      function classNameExists(name, excludeId = null) {
        const test = normalizeName(name).toLocaleLowerCase();
        return Object.values(state.data.classes).some(groupClass =>
          groupClass.id !== excludeId && groupClass.name.toLocaleLowerCase() === test
        );
      }

      function participantNameExists(name, excludeIndex = -1) {
        const groupClass = getCurrentClass();
        if (!groupClass) return false;
        const test = normalizeName(name).toLocaleLowerCase();
        return groupClass.participants.some((p, index) =>
          index !== excludeIndex && p.name.toLocaleLowerCase() === test
        );
      }

      function pairKey(a, b) {
        return [a, b].sort((x, y) => x.localeCompare(y)).join("||");
      }

      function getPairCount(a, b) {
        const groupClass = getCurrentClass();
        return groupClass ? (groupClass.pairCounts[pairKey(a, b)] || 0) : 0;
      }

      function shuffle(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function computeGroupSizes(total, preferredSize) {
        if (total < 2) return [];
        if (total === 2) return [2];
        if (total === 3) return [3];

        let best = null;

        for (let groups = 1; groups <= total; groups++) {
          const base = Math.floor(total / groups);
          const extra = total % groups;
          const max = base + (extra > 0 ? 1 : 0);

          if (base < 2) continue;
          if (max > 6) continue;

          const sizes = Array.from({ length: groups }, (_, i) => base + (i < extra ? 1 : 0));
          const min = Math.min(...sizes);
          if (min < 2) continue;

          const avgPenalty = sizes.reduce((sum, s) => sum + Math.abs(s - preferredSize), 0);
          const spreadPenalty = max - min;
          const groupCountPenalty = Math.abs(groups - Math.round(total / preferredSize)) * 0.15;
          const score = avgPenalty + spreadPenalty * 0.35 + groupCountPenalty;

          if (!best || score < best.score) {
            best = { sizes, score };
          }
        }

        if (best) return best.sizes;

        if (total % 2 === 0) return new Array(total / 2).fill(2);
        return [3, ...new Array((total - 3) / 2).fill(2)];
      }

      function scoreGroups(groups) {
        let repeatedScore = 0;
        let higherRepeatPenalty = 0;

        for (const group of groups) {
          for (let i = 0; i < group.length; i++) {
            for (let j = i + 1; j < group.length; j++) {
              const count = getPairCount(group[i], group[j]);
              repeatedScore += count;
              higherRepeatPenalty += count * count;
            }
          }
        }

        const randomNoise = Math.random() * 1.2;
        return repeatedScore * 3 + higherRepeatPenalty * 1.5 + randomNoise;
      }

      function generateBalancedGroups(names, preferredSize) {
        const sizes = computeGroupSizes(names.length, preferredSize);
        const attempts = 350;
        const candidates = [];

        for (let attempt = 0; attempt < attempts; attempt++) {
          const pool = shuffle(names);
          const groups = [];
          let index = 0;

          for (const size of sizes) {
            groups.push(pool.slice(index, index + size));
            index += size;
          }

          candidates.push({ groups, score: scoreGroups(groups) });
        }

        candidates.sort((a, b) => a.score - b.score);
        const topCount = Math.min(12, candidates.length);
        return candidates[Math.floor(Math.random() * topCount)].groups;
      }

      function updatePairHistory(groups) {
        const groupClass = getCurrentClass();
        if (!groupClass) return;

        for (const group of groups) {
          for (let i = 0; i < group.length; i++) {
            for (let j = i + 1; j < group.length; j++) {
              const key = pairKey(group[i], group[j]);
              groupClass.pairCounts[key] = (groupClass.pairCounts[key] || 0) + 1;
            }
          }
        }
      }

      function renderClassSelector() {
        const classes = Object.values(state.data.classes).sort((a, b) =>
          a.name.localeCompare(b.name, undefined, { sensitivity: "base" })

        if (current) {
          els.classSelect.value = current.id;
          els.groupSize.value = String(current.preferredSize);
        }

        els.deleteClassBtn.disabled = classes.length <= 1;

      function renderGroups() {
        const groupClass = getCurrentClass();
        if (!groupClass) return;

        if (!groupClass.currentGroups.length) {
          els.groupsContainer.innerHTML = `

              ${escapeHtml(t("groups.empty"))}

              <article class="group-card">

                  ${group.map(name => `<li>${escapeHtml(name)}</li>`).join("")}

      function renderHistory() {
        const groupClass = getCurrentClass();
        if (!groupClass) return;

        const count = groupClass.history.length;
        els.historyTitle.textContent = t("groups.history.title", { count });

        if (!count) {
          els.historyContainer.innerHTML = `
            <div class="empty">
              ${escapeHtml(t("groups.history.empty"))}
            </div>
          `;
          return;
        }

        const recentEntries = [...groupClass.history].reverse().slice(0, 8);

        const items = recentEntries.map(entry => {
          const timestamp = new Date(entry.timestamp);
          const label = isNaN(timestamp.getTime())
            ? t("groups.history.saved")
            : timestamp.toLocaleString(state.language);

          return `
            <div class="history-item">
              <div class="history-time">${escapeHtml(label)}</div>
              <div class="history-groups">
                ${entry.groups.map((group, index) => `
                  <div><strong>${escapeHtml(t("groups.groupLabel", { number: index + 1 }))}:</strong> ${group.map(escapeHtml).join(", ")}</div>
                `).join("")}
              </div>
            </div>
          `;
        }).join("");

        els.historyContainer.innerHTML = `<div class="history-list">${items}</div>`;
      }

        renderClassSelector();

        renderGroups();
        renderHistory();

          closeManageMenu();

          els.manageClassMenu.classList.add("open");
          els.manageClassBtn.setAttribute("aria-expanded", "true");
        }

      function createClass() {
        const raw = els.newClassInput.value;
        const name = normalizeName(raw);

        if (!name) {
          setMessageKey("class.validation.enterName", "error");
          return;
        }

        if (classNameExists(name)) {
          setMessageKey("class.validation.duplicateName", "error");
          return;
        }

        const groupClass = createClassObject(name);
        state.data.classes[groupClass.id] = groupClass;
        state.data.activeClassId = groupClass.id;
        els.newClassInput.value = "";
        saveState();
        renderAll();
        setMessageKey("class.ready", "success", { name });
      }

      function renameClass() {
        closeManageMenu();
        const groupClass = getCurrentClass();
        if (!groupClass) return;

        const updated = window.prompt(t("class.prompt.rename"), groupClass.name);
        if (updated === null) return;

        const name = normalizeName(updated);
        if (!name) {
          setMessageKey("class.validation.enterName", "error");
          return;
        }

        if (classNameExists(name, groupClass.id)) {
          setMessageKey("class.validation.duplicateName", "error");
          return;
        }

        groupClass.name = name;
        saveState();
        renderClassSelector();
        setMessageKey("class.nameUpdated", "success");
      }

      function switchClass(classId) {
        if (!state.data.classes[classId]) return;
        state.data.activeClassId = classId;
        saveState();
        renderAll();
        closeManageMenu();
        setMessageKey("class.changed", "info");
      }

      function deleteClass() {
        closeManageMenu();
        const ids = Object.keys(state.data.classes);
        if (ids.length <= 1) {
          setMessageKey("class.keepOne", "info");
          return;
        }

        const groupClass = getCurrentClass();
        if (!groupClass) return;

        const confirmed = window.confirm(t("class.confirm.delete", { name: groupClass.name }));
        if (!confirmed) return;

        delete state.data.classes[groupClass.id];
        const nextId = Object.keys(state.data.classes)[0];
        state.data.activeClassId = nextId || null;
        saveState();
        renderAll();
        setMessageKey("class.deleted", "success");
      }

      function addParticipant() {
        const groupClass = getCurrentClass();
        if (!groupClass) return;

        const raw = els.nameInput.value;
        const name = normalizeName(raw);

        if (!name) {
          setMessageKey("student.validation.enterName", "error");
          return;
        }

        if (participantNameExists(name)) {
          setMessageKey("student.validation.duplicateName", "error");
          return;
        }

        groupClass.participants.push({ name, absent: false });
        groupClass.participants.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
        els.nameInput.value = "";
        saveState();
        renderParticipants();
        setMessageKey("student.add.success", "success", { name });
      }

      function editParticipant(index) {
        const groupClass = getCurrentClass();
        if (!groupClass) return;

        const current = groupClass.participants[index];
        const updated = window.prompt(t("student.edit.prompt"), current.name);
        if (updated === null) return;

        const name = normalizeName(updated);
        if (!name) {
          setMessageKey("student.validation.emptyName", "error");
          return;
        }

        if (participantNameExists(name, index)) {
          setMessageKey("student.validation.duplicateName", "error");
          return;
        }

        current.name = name;
        groupClass.participants.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
        saveState();
        renderParticipants();
        setMessageKey("student.edit.success", "success");
      }

      function deleteParticipant(index) {
        const groupClass = getCurrentClass();
        if (!groupClass) return;

        const student = groupClass.participants[index];
        const confirmed = window.confirm(t("student.delete.confirm", { name: student.name }));
        if (!confirmed) return;

        groupClass.participants.splice(index, 1);
        saveState();
        renderParticipants();
        setMessageKey("student.delete.success", "success", { name: student.name });
      }

      function toggleAbsent(index) {
        const groupClass = getCurrentClass();
        if (!groupClass) return;

        const student = groupClass.participants[index];
        student.absent = !student.absent;
        saveState();
        renderParticipants();
      }

      function clearParticipants() {
        closeManageMenu();
        const groupClass = getCurrentClass();
        if (!groupClass) return;

        if (!groupClass.participants.length) {
          setMessageKey("student.alreadyEmpty", "info");
          return;
        }

        const confirmed = window.confirm(t("student.confirm.removeAll"));
        if (!confirmed) return;

        groupClass.participants = [];
        groupClass.currentGroups = [];
        saveState();
        renderAll();
        setMessageKey("student.removedAll", "success");
      }

      function clearCurrentGroups() {
        const groupClass = getCurrentClass();
        if (!groupClass) return;

        groupClass.currentGroups = [];
        saveState();
        renderGroups();
        setMessageKey("groups.clear.success", "info");
      }

      function resetHistory() {
        const groupClass = getCurrentClass();
        if (!groupClass) return;

        if (!groupClass.history.length && Object.keys(groupClass.pairCounts).length === 0) {
          setMessageKey("groups.history.nothingToClear", "info");
          return;
        }

        const confirmed = window.confirm(t("groups.history.confirmClear"));
        if (!confirmed) return;

        groupClass.history = [];
        groupClass.pairCounts = {};
        saveState();
        renderHistory();
        setMessageKey("groups.history.cleared", "success");
      }

      function generateGroups() {
        const groupClass = getCurrentClass();
        if (!groupClass) return;

        const available = groupClass.participants.filter(p => !p.absent).map(p => p.name);

        if (available.length < 2) {
          setMessageKey("groups.validation.notEnough", "error");
          return;
        }

        const sizes = computeGroupSizes(available.length, groupClass.preferredSize);
        if (!sizes.length || Math.min(...sizes) < 2) {
          setMessageKey("groups.validation.leavesOne", "error");
          return;
        }

        const groups = generateBalancedGroups(available, groupClass.preferredSize);
        groupClass.currentGroups = groups;
        updatePairHistory(groups);

        groupClass.history.push({
          timestamp: new Date().toISOString(),
          preferredSize: groupClass.preferredSize,
          groups
        });

        if (groupClass.history.length > 100) {
          groupClass.history = groupClass.history.slice(-100);
        }

        saveState();
        renderGroups();
        renderHistory();
        setMessageKey("groups.ready", "success");
      }

      function bindEvents() {
        els.languageSelect.addEventListener("change", () => {
          if (!translations[els.languageSelect.value]) return;
          state.language = els.languageSelect.value;
          saveLanguage();
          applyTranslations();
          renderAll();
          closeManageMenu();
        });

        els.createClassBtn.addEventListener("click", createClass);
        els.renameClassBtn.addEventListener("click", renameClass);
        els.deleteClassBtn.addEventListener("click", deleteClass);
        els.manageClassBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleManageMenu();
        });

        els.newClassInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") createClass();
        });

        els.classSelect.addEventListener("change", () => {
          switchClass(els.classSelect.value);
        });

        els.addBtn.addEventListener("click", addParticipant);
        els.nameInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") addParticipant();
        });

        els.groupSize.addEventListener("change", () => {
          const groupClass = getCurrentClass();
          if (!groupClass) return;
          groupClass.preferredSize = Number(els.groupSize.value);
          saveState();
        });

        els.generateBtn.addEventListener("click", generateGroups);
        els.clearParticipantsBtn.addEventListener("click", clearParticipants);
        els.resetHistoryBtn.addEventListener("click", resetHistory);
        els.clearCurrentBtn.addEventListener("click", clearCurrentGroups);

        els.participantsList.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;

          const action = target.getAttribute("data-action");
          const index = Number(target.getAttribute("data-index"));
          if (!action || Number.isNaN(index)) return;

          if (action === "edit") editParticipant(index);
          if (action === "delete") deleteParticipant(index);
          if (action === "toggle-absent") toggleAbsent(index);
        });

        document.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof Node)) return;
          if (!els.manageClassMenu.contains(target) && !els.manageClassBtn.contains(target)) {
            closeManageMenu();
          }
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeManageMenu();
        });
      }

      function init() {
        loadLanguage();
        applyTranslations();
        loadState();
        bindEvents();
        renderAll();
        setMessageKey("status.ready", "info");
      }

      init();
    })();
  </script>
</body>
</html>
